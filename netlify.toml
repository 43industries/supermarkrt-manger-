# Netlify Configuration for Supermarket POS System
# ⚠️ WARNING: Backend features (database, API) won't work on Netlify
# This is for STATIC FRONTEND ONLY (UI preview/demo)
# 
# For full-stack deployment, use Railway or Render instead
# See NETLIFY_FULL_STACK_GUIDE.md for details

[build]
  # No build command needed - we're deploying static HTML files
  publish = "."
  command = "echo 'Static site - no build needed'"

# Redirect root to main application
[[redirects]]
  from = "/"
  to = "/complete-system.html"
  status = 200

# Ensure all files are served correctly
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

# Headers for better caching (optional)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/libs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
