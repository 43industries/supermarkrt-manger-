                                        <p className="text-xs text-gray-500 mt-2">Avg Transaction: KES {emp.avgTransactionValue.toFixed(2)}</p>
                                      </div>
                                      <div className="ml-4">
                                        <span className="px-3 py-1 bg-yellow-400 text-yellow-900 rounded-full text-xs font-bold">
                                          #{index + 1} Rank
                                        </span>
                                      </div>
                                    </div>
                                  </button>
                                ))}
                                {getAllEmployeesPerformance().length === 0 && (
                                  <div className="text-center py-8 text-gray-500">
                                    <p>No sales data available for this month</p>
                                    <p className="text-sm mt-2">Employees will appear here after making sales</p>
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {/* Selected Employee Summary */}
                            <div className="bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-400 rounded-xl p-4">
                              <div className="flex items-center justify-between mb-3">
                                <div>
                                  <h4 className="text-xl font-black text-gray-900">{selectedEmployeeForReward.name}</h4>
                                  <p className="text-sm text-gray-600">Selected for Employee of the Month</p>
                                </div>
                                <button
                                  onClick={() => setSelectedEmployeeForReward(null)}
                                  className="px-3 py-1 bg-gray-200 text-gray-700 rounded-lg text-sm hover:bg-gray-300"
                                >
                                  Change
                                </button>
                              </div>
                              <div className="grid grid-cols-3 gap-3">
                                <div className="bg-white rounded-lg p-2">
                                  <p className="text-xs text-gray-600">Sales</p>
                                  <p className="text-lg font-bold text-blue-600">{selectedEmployeeForReward.totalSales}</p>
                                </div>
                                <div className="bg-white rounded-lg p-2">
                                  <p className="text-xs text-gray-600">Revenue</p>
                                  <p className="text-lg font-bold text-green-600">KES {selectedEmployeeForReward.totalRevenue.toLocaleString()}</p>
                                </div>
                                <div className="bg-white rounded-lg p-2">
                                  <p className="text-xs text-gray-600">Profit</p>
                                  <p className="text-lg font-bold text-purple-600">KES {selectedEmployeeForReward.totalProfit.toLocaleString()}</p>
                                </div>
                              </div>
                            </div>

                            {/* Reward Amount */}
                            <div>
                              <label className="block text-sm font-bold text-gray-700 mb-2">
                                Reward Amount (KES) *
                              </label>
                              <input
                                type="number"
                                value={rewardAmount}
                                onChange={(e) => setRewardAmount(e.target.value)}
                                placeholder="Enter reward amount"
                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl text-lg font-bold focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20"
                                autoFocus
                              />
                              <p className="text-xs text-gray-500 mt-1">This will be recorded as an expense</p>
                            </div>

                            {/* Notes */}
                            <div>
                              <label className="block text-sm font-bold text-gray-700 mb-2">
                                Notes (Optional)
                              </label>
                              <textarea
                                value={rewardNotes}
                                onChange={(e) => setRewardNotes(e.target.value)}
                                placeholder="Add notes about why this employee was selected..."
                                rows={3}
                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20"
                              />
                            </div>

                            {/* Current Month Info */}
                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-3">
                              <p className="text-sm text-blue-800">
                                <strong>📅 Month:</strong> {new Date().toLocaleString('default', { month: 'long', year: 'numeric' })}
                              </p>
                              <p className="text-xs text-blue-600 mt-1">
                                This award will be recorded for the current month
                              </p>
                            </div>

                            {/* Action Buttons */}
                            <div className="flex gap-3 pt-4">
                              <button
                                onClick={() => {
                                  setSelectedEmployeeForReward(null);
                                  setRewardAmount('');
                                  setRewardNotes('');
                                }}
                                className="flex-1 px-4 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300"
                              >
                                Back
                              </button>
                              <button
                                onClick={setEmployeeOfTheMonthReward}
                                disabled={!rewardAmount || parseFloat(rewardAmount) <= 0}
                                className="flex-1 px-4 py-3 bg-gradient-to-r from-yellow-500 to-orange-500 text-white rounded-xl font-bold hover:from-yellow-400 hover:to-orange-400 disabled:opacity-50 disabled:cursor-not-allowed"
                              >
                                🏆 Award Employee
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        // Compatibility: Wait for React to load, then initialize
        function initializeApp() {
            // Check if React is loaded
            if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
                setTimeout(initializeApp, 100);
                return;
            }
            
            const rootElement = document.getElementById('root');
            if (!rootElement) {
                console.error('Root element not found');
                return;
            }
            
            try {
                // Compatibility: Use React 18 createRoot if available, fallback to React 17 render
                if (ReactDOM.createRoot) {
                    // React 18
                    const root = ReactDOM.createRoot(rootElement);
                    root.render(React.createElement(CompleteSystem));
                } else if (ReactDOM.render) {
                    // React 17 fallback
                    ReactDOM.render(React.createElement(CompleteSystem), rootElement);
                } else {
                    // Error fallback
                    rootElement.innerHTML = '<div style="padding: 50px; text-align: center; font-family: Arial;"><h1 style="color: red;">Error: React not loaded</h1><p>Please check your internet connection and refresh the page.</p><p style="font-size: 12px; color: #666;">If the problem persists, try using a modern browser like Chrome, Firefox, or Edge.</p></div>';
                }
                console.log('✅ Complete system loaded successfully!');
            } catch (error) {
                console.error('Error initializing app:', error);
                rootElement.innerHTML = '<div style="padding: 50px; text-align: center; font-family: Arial;"><h1 style="color: red;">Error Loading Application</h1><p>' + error.message + '</p><p style="font-size: 12px; color: #666;">Please check the browser console (F12) for more details.</p></div>';
            }
        }
        
        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
