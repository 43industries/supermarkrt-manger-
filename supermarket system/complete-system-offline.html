    <!-- Polyfills for older browsers -->
    <script src="https://cdn.jsdelivr.net/npm/core-js-bundle@3/minified.js"></script>
    <!-- React 18 - loaded synchronously so React is defined before Babel/app runs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        // Configure Babel for maximum browser compatibility (IE 11+, older browsers)
        if (typeof Babel !== 'undefined') {
            // Set default options for older browser support
            window.babelOptions = {
                presets: ['react', 'env'],
                plugins: ['transform-object-rest-spread'],
                compact: false,
                retainLines: true
            };
        }
    </script>
    <!-- QR Code Generator Library -->

    <style>
        /* ============= ULTIMATE POS ANIMATIONS ============= */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4), 0 0 40px rgba(34, 197, 94, 0.2); }
            50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.6), 0 0 80px rgba(34, 197, 94, 0.4); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes scan-line {
            0% { top: 0; opacity: 1; }
            50% { opacity: 0.5; }
            100% { top: 100%; opacity: 1; }
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes number-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @keyframes slide-in {
            0% { transform: translateX(100px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes success-flash {
            0% { background-color: transparent; }
            50% { background-color: rgba(34, 197, 94, 0.3); }
            100% { background-color: transparent; }
        }
        
        .animate-shimmer { animation: shimmer 2s infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-gradient { 
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite; 
        }
        .animate-slide-in { animation: slide-in 0.3s ease-out; }
        .animate-pop { animation: number-pop 0.3s ease-out; }
        
        /* Glass effect */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Scrollbar styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Thermal Receipt Print Styles - 80mm (302px) paper */
        @media print {
            @page {
                size: 80mm auto;
                margin: 0;
            }
            
            body {
                margin: 0;
                padding: 0;
                width: 80mm;
            }
            
            /* Hide everything except receipt */
            body * {
                visibility: hidden;
            }
            
            .receipt-print-area, .receipt-print-area * {
                visibility: visible;
            }
            
            .receipt-print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                max-width: 80mm;
                padding: 2mm;
                font-family: 'Courier New', Courier, monospace;
                font-size: 12px;
                line-height: 1.3;
                background: white;
            }
            
            .receipt-print-area h2 {
                font-size: 16px;
                margin: 0;
            }
            
            .receipt-print-area table {
                width: 100%;
                font-size: 11px;
            }
            
            .receipt-print-area th,
            .receipt-print-area td {
                padding: 1px 2px;
            }
            
            .no-print {
                display: none !important;
            }
            
            .qr-code-container {
                text-align: center;
                margin: 8px 0;
            }
            
            .qr-code-container canvas,
            .qr-code-container img {
                max-width: 100px;
                max-height: 100px;
            }
        }
        
        /* Screen preview styles for thermal receipt */
        .thermal-receipt {
            font-family: 'Courier New', Courier, monospace;
            max-width: 302px;
            margin: 0 auto;
            background: white;
            padding: 10px;
        }
        
        .thermal-receipt h2 {
            font-size: 18px;
            font-weight: bold;
        }
        
        .thermal-receipt .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            border-bottom: 1px dotted #ccc;
            padding: 2px 0;
        }
        
        .dashed-line {
            border-top: 1px dashed #000;
            margin: 8px 0;
        }
    </style>
</head>

        const safeParseJSON = (str, fallback) => {
          if (str == null || str === '') return fallback;
          try {
            const parsed = JSON.parse(str);
            return parsed != null ? parsed : fallback;
          } catch (_) { return fallback; }
        };
        const safeNextId = (arr, key = 'id') => {
          if (!Array.isArray(arr) || arr.length === 0) return 1;
          const max = Math.max(0, ...arr.map(x => (x && (x[key] ?? x.id)) || 0));
          return max + 1;

        // ============================================================================

        /**
         * CompleteSystem - Main React component for the POS Management System
         * 
         * This component manages the entire supermarket POS system including:
         * - Point of Sale (POS) operations
         * - Inventory management
         * - Sales tracking and reporting
         * - Employee management and time tracking
         * - Customer loyalty program
         * - Purchase orders and invoicing
         * - Financial reporting and analytics
         * 
         * @component
         */
        const CompleteSystem = () => {
          // ============================================================================
          // SECTION 1: AUTHENTICATION & USER STATE
          // ============================================================================
          /**
           * Authentication State Variables:
           * - isLoggedIn: Boolean flag indicating if user is currently authenticated
           * - currentUser: Object containing logged-in user details (id, name, role, username)
           * - loginForm: Form state for login inputs (username, password, rememberMe checkbox)
           * - currentView: String indicating which view/screen is currently displayed
           */

            const savedUser = localStorage.getItem('logged_in_user');
            return savedUser !== null;
          });
          const [currentUser, setCurrentUser] = useState(() => {
            const savedUser = localStorage.getItem('logged_in_user');
            return safeParseJSON(savedUser, null);
          });
          const [loginForm, setLoginForm] = useState({ username: '', password: '', rememberMe: true });
          const [currentView, setCurrentView] = useState('dashboard');

          // ============================================================================
          // SECTION 2: DEFAULT DATA
          // ============================================================================
          /**
           * Default Data Constants:
           * These are initial data sets used when localStorage is empty (first-time setup)
           * Each array contains sample data with proper structure for the system
           */

          const defaultSales = [
            { id: 1, date: '2025-11-10', time: '10:30', items: 3, total: 265, profit: 85, paymentMethod: 'Cash' },
            { id: 2, date: '2025-11-10', time: '11:15', items: 5, total: 580, profit: 180, paymentMethod: 'M-Pesa' },
          ];

          const defaultCustomers = [
            { id: 1, name: 'John Doe', phone: '+254700111222', email: 'john@email.com', points: 450 },
            { id: 2, name: 'Jane Smith', phone: '+254700333444', email: 'jane@email.com', points: 780 },
          ];

          const defaultSuppliers = [
            { id: 1, name: 'ABC Distributors', phone: '0722111222', email: 'abc@supplier.com', address: 'Nairobi CBD', products: ['Rice', 'Sugar', 'Flour'], totalPurchases: 125000 },
            { id: 2, name: 'Fresh Foods Ltd', phone: '0733222333', email: 'fresh@foods.co.ke', address: 'Industrial Area', products: ['Milk', 'Bread', 'Eggs'], totalPurchases: 85000 },
          ];

          const defaultExpenses = [
            { id: 1, date: '2025-12-01', category: 'Rent', description: 'Monthly rent', amount: 25000 },
            { id: 2, date: '2025-12-05', category: 'Utilities', description: 'Electricity bill', amount: 3500 },
          ];

          // ============================================================================
          // SECTION 3: CORE DATA STATE
          // ============================================================================
          /**
           * Core Data State Variables:
           * All core business data stored in state and persisted to localStorage
           * 
           * - products: Array of product objects (id, name, barcode, category, prices, stock)
           * - sales: Array of completed sales transactions
           * - customers: Array of customer records with loyalty points
           * - suppliers: Array of supplier/vendor information
           * - expenses: Array of business expenses for financial tracking
           * - cashRegister: Object tracking cash register status (open/closed, float amount)
           * - quickButtons: Array of frequently used products for quick access in POS
           */
          const [products, setProducts] = useState(() => {
            const saved = localStorage.getItem('products');
            return safeParseJSON(saved, defaultProducts);
          });
          const [sales, setSales] = useState(() => {
            const saved = localStorage.getItem('sales');

          // ============================================================================

          /**

           * @param {string} action - Type of action (SALE, BREAK_START, BREAK_END, CLOCK_IN, CLOCK_OUT)
           * @param {Object} details - Additional details about the action
           */
          const logEmployeeActivity = (action, details = {}) => {
            if (!currentUser) return;

            const activity = {
              id: Date.now(),
              employeeId: currentUser.id,
              employeeName: currentUser.name,
              employeeRole: currentUser.role,
              action: action,
              timestamp: new Date().toISOString(),
              date: new Date().toISOString().split('T')[0],
              time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
              details: details
            };

            setEmployeeActivities(prev => [activity, ...prev.slice(0, 9999)]); // Keep last 10,000 activities
          };

          /**
           * Clock in employee
           */
          const clockIn = () => {
            if (!currentUser) {
              alert('Please log in first');
              return;
            }

            const today = new Date().toISOString().split('T')[0];
            const existingAttendance = employeeAttendance.find(a => 
              a.employeeId === currentUser.id && 
              a.date === today &&
              a.clockOut === null
            );

            if (existingAttendance) {
              alert('⚠️ You are already clocked in!\n\nClock in time: ' + existingAttendance.clockIn);
              return;
            }

            const clockInTime = new Date().toISOString();
            const attendance = {
              id: Date.now(),
              employeeId: currentUser.id,
              employeeName: currentUser.name,
              date: today,
              clockIn: clockInTime,
              clockOut: null,
              onBreak: false,
              breakStartTime: null,
              breakEndTime: null,
              totalBreakTime: 0 // in minutes
            };

            setEmployeeAttendance([...employeeAttendance, attendance]);
            logEmployeeActivity('CLOCK_IN', { clockInTime });
            
            setCurrentClockStatus({
              clockedIn: true,
              clockInTime: clockInTime,
              clockOutTime: null,
              onBreak: false,
              breakStartTime: null,
              breakEndTime: null
            });

            alert(`✅ Clocked In Successfully!\n\nTime: ${new Date().toLocaleTimeString()}\nDate: ${today}`);
          };

          /**
           * Clock out employee
           */
          const clockOut = () => {
            if (!currentUser) {
              alert('Please log in first');
              return;
            }

            const today = new Date().toISOString().split('T')[0];
            const attendance = employeeAttendance.find(a => 
              a.employeeId === currentUser.id && 
              a.date === today &&
              a.clockOut === null
            );

            if (!attendance) {
              alert('⚠️ You are not clocked in!\n\nPlease clock in first.');
              return;
            }

            if (attendance.onBreak) {
              const confirmBreak = window.confirm('⚠️ You are currently on break!\n\nDo you want to end your break and clock out?');
              if (!confirmBreak) return;
              // End break first
              const breakEndTime = new Date().toISOString();
              const breakDuration = Math.round((new Date(breakEndTime) - new Date(attendance.breakStartTime)) / 60000);
              attendance.onBreak = false;
              attendance.breakEndTime = breakEndTime;
              attendance.totalBreakTime = (attendance.totalBreakTime || 0) + breakDuration;
              logEmployeeActivity('BREAK_END', { breakEndTime, breakDuration });
            }

            const clockOutTime = new Date().toISOString();
            const workDuration = Math.round((new Date(clockOutTime) - new Date(attendance.clockIn)) / 60000);
            const netWorkTime = workDuration - (attendance.totalBreakTime || 0);

            attendance.clockOut = clockOutTime;
            attendance.workDuration = workDuration; // total minutes
            attendance.netWorkTime = netWorkTime; // minutes minus breaks

            setEmployeeAttendance(employeeAttendance.map(a => 
              a.id === attendance.id ? attendance : a
            ));

            logEmployeeActivity('CLOCK_OUT', { 
              clockOutTime, 
              workDuration: `${Math.floor(workDuration / 60)}h ${workDuration % 60}m`,
              netWorkTime: `${Math.floor(netWorkTime / 60)}h ${netWorkTime % 60}m`,
              breakTime: `${Math.floor((attendance.totalBreakTime || 0) / 60)}h ${(attendance.totalBreakTime || 0) % 60}m`
            });

            setCurrentClockStatus({
              clockedIn: false,
              clockInTime: attendance.clockIn,
              clockOutTime: clockOutTime,
              onBreak: false,
              breakStartTime: null,
              breakEndTime: null
            });

            alert(`✅ Clocked Out Successfully!\n\n` +
              `Work Time: ${Math.floor(workDuration / 60)}h ${workDuration % 60}m\n` +
              `Break Time: ${Math.floor((attendance.totalBreakTime || 0) / 60)}h ${(attendance.totalBreakTime || 0) % 60}m\n` +
              `Net Work Time: ${Math.floor(netWorkTime / 60)}h ${netWorkTime % 60}m`);
          };

          /**
           * Start break
           */
          const startBreak = () => {
            if (!currentUser) {
              alert('Please log in first');
              return;
            }

            const today = new Date().toISOString().split('T')[0];
            const attendance = employeeAttendance.find(a =>

            const breakStartTime = new Date().toISOString();

            setCurrentClockStatus({
              ...currentClockStatus,

            alert(`✅ Break Started\n\nTime: ${new Date().toLocaleTimeString()}\n\nRemember to end your break when you return!`);

          /**
           * Get employee performance statistics
           * @param {string} employeeName - The name of the employee (must match cashier name in sales)
           * @returns {Object} Performance statistics including sales, revenue, and profit
           */
          const getEmployeeStats = (employeeName) => {
            if (!employeeName || typeof employeeName !== 'string') {
              return {
                totalSales: 0,
                totalRevenue: 0,
                totalProfit: 0,
                monthSales: 0,
                monthRevenue: 0,
                monthProfit: 0
              };
            }

            try {
              const allTimeSales = sales.filter(s => 
                s.cashier === employeeName && 
                !s.voided &&
                s.total !== undefined &&
                s.total !== null
              );
              
              const currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM format
              const monthSales = allTimeSales.filter(s => 
                s.date && 
                typeof s.date === 'string' && 
                s.date.startsWith(currentMonth)
              );
              
              return {
                totalSales: allTimeSales.length,
                totalRevenue: allTimeSales.reduce((sum, s) => sum + (parseFloat(s.total) || 0), 0),
                totalProfit: allTimeSales.reduce((sum, s) => sum + (parseFloat(s.profit) || 0), 0),
                monthSales: monthSales.length,
                monthRevenue: monthSales.reduce((sum, s) => sum + (parseFloat(s.total) || 0), 0),
                monthProfit: monthSales.reduce((sum, s) => sum + (parseFloat(s.profit) || 0), 0)
              };
            } catch (error) {
              console.error('Error calculating employee stats:', error);
              return {
                totalSales: 0,
                totalRevenue: 0,
                totalProfit: 0,
                monthSales: 0,
                monthRevenue: 0,
                monthProfit: 0
              };
            }
          };

          /**
           * Add a new employee to the system
           * Creates both an employee record and a corresponding user account
           * Validates input and checks for duplicate usernames
           */
          const addEmployee = () => {
            // Validation: Check required fields
            if (!newEmployee.name || !newEmployee.name.trim()) {
              alert('⚠️ Please enter employee name');
              return;
            }

            if (!newEmployee.username || !newEmployee.username.trim()) {
              alert('⚠️ Please enter username');
              return;
            }

            // Validate username format (alphanumeric and underscore only, 3-20 chars)
            const usernameRegex = /^[a-zA-Z0-9_]{3,20}$/;
            if (!usernameRegex.test(newEmployee.username)) {
              alert('⚠️ Invalid username format!\n\nUsername must be 3-20 characters and contain only letters, numbers, and underscores.');
              return;
            }

            // Check for duplicate username in employees
            const existingEmployee = employees.find(e => 
              e.username && 
              e.username.toLowerCase() === newEmployee.username.toLowerCase()
            );
            
            // Check for duplicate username in users
            const existingUser = users.find(u => 
              u.username && 
              u.username.toLowerCase() === newEmployee.username.toLowerCase()
            );
            
            if (existingEmployee || existingUser) {
              alert('⚠️ Username already exists!\n\nPlease choose a different username.');
              return;
            }

            try {
              // Generate new employee ID
              const maxId = employees.length > 0 
                ? Math.max(...employees.map(e => e.id || 0), 0) 
                : 0;
              
              const employee = {
                id: maxId + 1,
                name: newEmployee.name.trim(),
                username: newEmployee.username.trim().toLowerCase(),
                role: newEmployee.role || 'Cashier',
                phone: (newEmployee.phone || '').trim(),
                email: (newEmployee.email || '').trim(),
                hireDate: newEmployee.hireDate || new Date().toISOString().split('T')[0],
                status: newEmployee.status || 'Active',
                notes: (newEmployee.notes || '').trim()
              };

              // Create corresponding user account with default password
              const defaultPassword = 'password123';
              const newUser = {
                id: employee.id,
                username: employee.username,
                password: defaultPassword, // Will be hashed on next login
                passwordHash: hashPassword(defaultPassword),
                role: employee.role,
                name: employee.name
              };

              // Update state
              setEmployees([...employees, employee]);
              setUsers([...users, newUser]);
              
              // Reset form
              setShowAddEmployee(false);
              setNewEmployee({
                name: '',
                username: '',
                role: 'Cashier',
                phone: '',
                email: '',
                hireDate: new Date().toISOString().split('T')[0],
                status: 'Active',
                notes: ''
              });

              // Log audit event
              logAuditEvent('EMPLOYEE_ADDED', {
                employee: employee.name,
                username: employee.username,
                role: employee.role,
                employeeId: employee.id
              });

              // Success message
              alert(`✅ Employee Added Successfully!\n\n` +
                `Name: ${employee.name}\n` +
                `Username: ${employee.username}\n` +
                `Role: ${employee.role}\n` +
                `Status: ${employee.status}\n\n` +
                `Default Password: ${defaultPassword}\n\n` +
                `⚠️ Please change the password in User Accounts section for security.`);
            } catch (error) {
              console.error('Error adding employee:', error);
              alert('❌ Error adding employee. Please try again.');
            }
          };

          /**
           * Update an existing employee's information
           * Also updates the corresponding user account if it exists
           * Validates input and checks for duplicate usernames
           */
          const updateEmployee = () => {
            // Validation: Check required fields
            if (!editingEmployee || !editingEmployee.id) {
              alert('⚠️ Invalid employee data');
              return;
            }

            if (!editingEmployee.name || !editingEmployee.name.trim()) {
              alert('⚠️ Please enter employee name');
              return;
            }

            if (!editingEmployee.username || !editingEmployee.username.trim()) {
              alert('⚠️ Please enter username');
              return;
            }

            // Validate username format
            const usernameRegex = /^[a-zA-Z0-9_]{3,20}$/;
            if (!usernameRegex.test(editingEmployee.username)) {
              alert('⚠️ Invalid username format!\n\nUsername must be 3-20 characters and contain only letters, numbers, and underscores.');
              return;
            }

            try {
              // Check for duplicate username (excluding current employee)
              const duplicateEmployee = employees.find(e => 
                e.id !== editingEmployee.id &&
                e.username &&
                e.username.toLowerCase() === editingEmployee.username.toLowerCase()
              );
              
              const duplicateUser = users.find(u => 
                u.id !== editingEmployee.id &&
                u.username &&
                u.username.toLowerCase() === editingEmployee.username.toLowerCase()
              );

              if (duplicateEmployee || duplicateUser) {
                alert('⚠️ Username already exists!\n\nPlease choose a different username.');
                return;
              }

              // Prepare updated employee data
              const updatedEmployee = {
                ...editingEmployee,
                name: editingEmployee.name.trim(),
                username: editingEmployee.username.trim().toLowerCase(),
                phone: (editingEmployee.phone || '').trim(),
                email: (editingEmployee.email || '').trim(),
                notes: (editingEmployee.notes || '').trim()
              };

              // Update employee record
              setEmployees(employees.map(e => 
                e.id === updatedEmployee.id ? updatedEmployee : e
              ));

              // Update corresponding user account if it exists
              setUsers(users.map(u => 
                u.id === updatedEmployee.id ? {
                  ...u,
                  username: updatedEmployee.username,
                  name: updatedEmployee.name,
                  role: updatedEmployee.role || u.role
                } : u
              ));

              // Log audit event
              logAuditEvent('EMPLOYEE_UPDATED', {
                employee: updatedEmployee.name,
                employeeId: updatedEmployee.id,
                changes: {
                  name: updatedEmployee.name,
                  username: updatedEmployee.username,
                  role: updatedEmployee.role,
                  status: updatedEmployee.status
                }
              });

              // Close edit modal
              setEditingEmployee(null);
              
              // Success message
              alert('✅ Employee updated successfully!');
            } catch (error) {
              console.error('Error updating employee:', error);
              alert('❌ Error updating employee. Please try again.');
            }

          // Export functions
          const exportToCSV = (data, filename) => {
            if (!data || data.length === 0) {
              alert('No data to export');
              return;

            const headers = Object.keys(data[0]);
            const csv = [
              headers.join(','),
              ...data.map(row => headers.map(h => {
                let val = row[h];
                if (typeof val === 'object') val = JSON.stringify(val);
                if (typeof val === 'string' && val.includes(',')) val = '"' + val + '"';
                return val;
              }).join(','))
            ].join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            URL.revokeObjectURL(url);
          };

          /** Simple CSV parser: handles quoted commas. Returns { headers: string[], rows: string[][] } */
          const parseCSV = (text) => {
            var raw = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            if (raw.length && raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
            var lines = raw.split('\n').filter(function(l) { return l.length > 0; });
            if (lines.length === 0) return { headers: [], rows: [] };
            var out = [];
            for (var i = 0; i < lines.length; i++) {
              var row = [];
              var line = lines[i];
              var j = 0;
              while (j < line.length) {
                if (line[j] === '"') {
                  var end = line.indexOf('"', j + 1);
                  if (end === -1) end = line.length;
                  row.push(line.slice(j + 1, end).replace(/""/g, '"'));
                  j = end + 1;
                  if (line[j] === ',') j++;
                } else {
                  var comma = line.indexOf(',', j);
                  if (comma === -1) { row.push(line.slice(j).trim()); break; }
                  row.push(line.slice(j, comma).trim());
                  j = comma + 1;
                }
              }
              out.push(row);
            }
            var headers = out[0].map(function(h) { return String(h).toLowerCase().trim(); });
            return { headers: headers, rows: out };
          };

          /** Download CSV template for import */
          const downloadSpreadsheetTemplate = (type) => {

          /**

           * Products: add new or update by barcode. Customers/Suppliers: add new.
           */
          const importFromSpreadsheet = (file, type, baseProducts, baseCustomers, baseSuppliers) => {
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
              try {
                var parsed = parseCSV(e.target.result);
                var headers = parsed.headers;
                var rows = parsed.rows;
                if (headers.length === 0 || rows.length < 2) {
                  alert('CSV must have a header row and at least one data row.');
                  return;
                }
                var idx = function(keys) {
                  for (var k = 0; k < keys.length; k++) {
                    for (var i = 0; i < headers.length; i++) {
                      if (headers[i].indexOf(keys[k]) !== -1) return i;
                    }
                  }
                  return -1;
                };
                if (type === 'products') {
                  var nameI = idx(['name', 'product', 'item']);
                  var barcodeI = idx(['barcode', 'code', 'sku']);
                  var catI = idx(['category']);
                  var costI = idx(['cost', 'costprice', 'buy']);
                  var sellI = idx(['sell', 'price', 'retail', 'selling']);
                  var stockI = idx(['stock', 'qty', 'quantity']);
                  var reorderI = idx(['reorder', 'min']);
                  if (nameI === -1 || sellI === -1) {
                    alert('Products CSV must include columns for name and price (or selling price). Use the template.');
                    return;
                  }
                  var existing = Array.isArray(baseProducts) ? baseProducts.slice() : [];
                  if (existing.length === 0) {
                    existing = safeParseJSON(localStorage.getItem('products'), []) || [];
                  }
                  var maxId = existing.length ? Math.max.apply(null, existing.map(function(p) { return p.id || 0; })) : 0;
                  var byBarcode = {};
                  for (var i = 0; i < existing.length; i++) {
                    if (existing[i].barcode) byBarcode[existing[i].barcode] = i;
                  }
                  var added = 0;
                  var updated = 0;
                  for (var r = 1; r < rows.length; r++) {
                    var row = rows[r];
                    var name = (row[nameI] || '').trim();
                    if (!name) continue;
                    var barcode = (barcodeI >= 0 ? (row[barcodeI] || '') : '').trim();
                    var cost = costI >= 0 ? parseFloat(String(row[costI]).replace(/[^0-9.-]/g, '')) : 0;
                    var sell = sellI >= 0 ? parseFloat(String(row[sellI]).replace(/[^0-9.-]/g, '')) : 0;
                    if (isNaN(sell)) sell = 0;
                    var stock = stockI >= 0 ? parseInt(String(row[stockI]).replace(/\D/g, ''), 10) : 0;
                    if (isNaN(stock)) stock = 0;
                    var reorder = reorderI >= 0 ? parseInt(String(row[reorderI]).replace(/\D/g, ''), 10) : 10;
                    if (isNaN(reorder)) reorder = 10;
                    var category = catI >= 0 ? (row[catI] || '').trim() : '';
                    var bar = barcode || ('IMP' + (maxId + 1));
                    if (barcode && byBarcode[barcode] !== undefined) {
                      var ix = byBarcode[barcode];
                      existing[ix] = { id: existing[ix].id, name: name, barcode: barcode, category: category, costPrice: cost, sellingPrice: sell, stock: stock, reorderLevel: reorder };
                      updated++;
                    } else {
                      maxId++;
                      var newP = { id: maxId, name: name, barcode: bar, category: category, costPrice: cost, sellingPrice: sell, stock: stock, reorderLevel: reorder };
                      existing.push(newP);
                      if (bar) byBarcode[bar] = existing.length - 1;
                      added++;
                    }
                  }
                  setProducts(existing);
                  alert('Products import done. Added: ' + added + ', Updated: ' + updated);
                } else if (type === 'customers') {
                  var nI = idx(['name']);
                  var pHI = idx(['phone', 'mobile', 'tel']);
                  var eI = idx(['email']);
                  if (nI === -1 || pHI === -1) {
                    alert('Customers CSV must include name and phone columns. Use the template.');
                    return;
                  }
                  var cust = Array.isArray(baseCustomers) ? baseCustomers.slice() : [];
                  if (cust.length === 0) { cust = safeParseJSON(localStorage.getItem('customers'), []) || []; }
                  var cMaxId = cust.length ? Math.max.apply(null, cust.map(function(c) { return c.id || 0; })) : 0;
                  var cAdded = 0;
                  for (var r = 1; r < rows.length; r++) {
                    var row = rows[r];
                    var nm = (row[nI] || '').trim();
                    var ph = (row[pHI] || '').trim();
                    if (!nm || !ph) continue;
                    cMaxId++;
                    cust.push({ id: cMaxId, name: nm, phone: ph, email: (eI >= 0 ? (row[eI] || '').trim() : ''), points: 0, totalSpent: 0, visits: 0, joinDate: new Date().toISOString().split('T')[0] });
                    cAdded++;
                  }
                  setCustomers(cust);
                  alert('Customers import done. Added ' + cAdded + ' new customers.');
                } else if (type === 'suppliers') {
                  var snI = idx(['name']);
                  var spHI = idx(['phone', 'mobile', 'tel']);
                  var seI = idx(['email']);
                  var saI = idx(['address']);
                  if (snI === -1 || spHI === -1) {
                    alert('Suppliers CSV must include name and phone columns. Use the template.');
                    return;
                  }
                  var sup = Array.isArray(baseSuppliers) ? baseSuppliers.slice() : [];
                  if (sup.length === 0) { sup = safeParseJSON(localStorage.getItem('suppliers'), []) || []; }
                  var sMaxId = sup.length ? Math.max.apply(null, sup.map(function(s) { return s.id || 0; })) : 0;
                  var sAdded = 0;
                  for (var r = 1; r < rows.length; r++) {
                    var row = rows[r];
                    var nm = (row[snI] || '').trim();
                    var ph = (row[spHI] || '').trim();
                    if (!nm || !ph) continue;
                    sMaxId++;
                    sup.push({ id: sMaxId, name: nm, phone: ph, email: seI >= 0 ? (row[seI] || '').trim() : '', address: saI >= 0 ? (row[saI] || '').trim() : '', products: [], totalPurchases: 0 });
                    sAdded++;
                  }
                  setSuppliers(sup);
                  alert('Suppliers import done. Added ' + sAdded + ' new suppliers.');
                }
              } catch (err) {
                alert('Import failed: ' + (err.message || String(err)));
              }
            };
            reader.readAsText(file, 'UTF-8');
          };

          // Debounced localStorage saves for better performance
          const saveTimeoutRef = useRef({});

            if (saveTimeoutRef.current[key]) clearTimeout(saveTimeoutRef.current[key]);

              try {
                localStorage.setItem(key, JSON.stringify(data));
              } catch (e) {
                console.error('localStorage save failed:', key, e);
              }

            Object.keys(saveTimeoutRef.current).forEach(k => {
              if (saveTimeoutRef.current[k]) clearTimeout(saveTimeoutRef.current[k]);
            });
            saveTimeoutRef.current = {};
            const d = persistedDataRef.current;
            const keys = ['products','sales','customers','suppliers','expenses','cashRegister','quickButtons','stock_history','purchases','invoices','held_orders','returns'];
            keys.forEach(k => {
              const val = d[k];

          // Debounced search term for better performance

          const filteredProducts = useMemo(() => {

          const getEmployeePerformance = (employeeName) => {
            const currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM
            const monthSales = sales.filter(s => 
              s.cashier === employeeName && 
              s.date && s.date.startsWith(currentMonth) &&

            );
            
            const totalSales = monthSales.length;
            const totalRevenue = monthSales.reduce((sum, s) => sum + (s.total || 0), 0);
            const totalProfit = monthSales.reduce((sum, s) => sum + (s.profit || 0), 0);
            const avgTransactionValue = totalSales > 0 ? totalRevenue / totalSales : 0;
            
            return {
              name: employeeName,
              totalSales,
              totalRevenue,
              totalProfit,
              avgTransactionValue,
              month: currentMonth
            };
          };

          /**
           * Password Hashing Function
           * 
           * Converts plain text password to a simple hash for client-side storage.
           * Uses a basic hash algorithm (not cryptographically secure, but sufficient for demo).
           * 
           * Algorithm:
           * 1. Initialize hash to 0
           * 2. For each character in password:
           *    - Get character code
           *    - Apply bitwise left shift and addition
           * 3. Convert to 32-bit integer
           * 4. Return absolute value as hexadecimal string
           * 
           * @param {string} password - Plain text password to hash
           * @returns {string} Hexadecimal hash string
           * 
           * @example
           * hashPassword('admin123') // Returns: 'a1b2c3d4'
           */
          const hashPassword = (password) => {
            if (!password || typeof password !== 'string') return '';
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
              const char = password.charCodeAt(i);
              hash = ((hash << 5) - hash) + char;
              hash = hash & hash; // Convert to 32bit integer
            }
            return Math.abs(hash).toString(16);
          };

          const checkRateLimit = (username) => {

           * 
           * @param {string} input - Input value to validate

           * 
           * @example
           * if (!validateInput(username, 'username')) {
           *   alert('Invalid username format');
           *   return;
           * }
           */
          const validateInput = (input, type) => {
            if (type === 'username') {
              return /^[a-zA-Z0-9_]{3,20}$/.test(input);

            if (type === 'password') {
              return input.length >= 6;

            if (type === 'email') {

            }
            if (type === 'phone') {
              return /^[0-9+\-\s()]{10,15}$/.test(input);
            }
            return true;
          };

              return { valid: true };
            }

            if (!returnVerificationCode || returnVerificationCode.length < 4) {
              return {
                valid: false,
                error: '🔒 VERIFICATION CODE REQUIRED\n\nPlease enter the receipt verification code.\n\nThis code should be on the original receipt.'
              };
            }

            const expectedCode = selectedSaleForReturn.verificationCode || 
                               selectedSaleForReturn.id.toString().padStart(6, '0').slice(-4);
            const saleIdMatch = returnVerificationCode === selectedSaleForReturn.id.toString();
            const codeMatch = returnVerificationCode === expectedCode;
            
            if (!codeMatch && !saleIdMatch) {
              const confirmed = window.confirm(
                `⚠️ VERIFICATION CODE MISMATCH\n\n` +
                `The entered code does not match the sale.\n\n` +
                `Expected code format: Last 4 digits of sale ID\n` +
                `Sale ID: ${selectedSaleForReturn.id}\n\n` +
                `Do you want to proceed anyway? (Requires manager override)`
              );
              
              if (!confirmed) {
                logAuditEvent('RETURN_VERIFICATION_FAILED', {
                  saleId: selectedSaleForReturn.id,
                  enteredCode: returnVerificationCode,
                  attemptedBy: currentUser.name
                });
                return { valid: false, error: 'Verification cancelled' };
              }
              
              if (!returnManagerApproval) {
                return {
                  valid: false,
                  error: '🔒 MANAGER OVERRIDE REQUIRED\n\nVerification code mismatch requires manager approval.'
                };
              }
            }

            return { valid: true };
          };

          /**
           * Validate manager approval requirements
           * @param {number} refundAmount - Total refund amount
           * @returns {Object} Validation result with error message if invalid
           */
          const validateManagerApproval = (refundAmount) => {
            const requiresApproval = refundAmount > RETURN_SECURITY_CONFIG.maxReturnAmountWithoutApproval || 
                                    RETURN_SECURITY_CONFIG.requireManagerApproval;
            
            if (!requiresApproval) {
              return { valid: true };
            }

            if (!returnManagerApproval) {
              return {
                valid: false,
                error: `🔒 MANAGER APPROVAL REQUIRED\n\n` +
                  `Return Amount: KES ${refundAmount.toLocaleString()}\n` +
                  `Threshold: KES ${RETURN_SECURITY_CONFIG.maxReturnAmountWithoutApproval.toLocaleString()}\n\n` +
                  `Please enter manager password to approve this return.`
              };
            }

            if (!verifyManagerPassword(returnManagerPassword)) {
              logAuditEvent('RETURN_MANAGER_PASSWORD_FAILED', {
                saleId: selectedSaleForReturn.id,
                refundAmount: refundAmount,
                attemptedBy: currentUser.name
              });
              setReturnManagerPassword('');
              return {
                valid: false,
                error: '❌ INVALID MANAGER PASSWORD\n\nManager approval password is incorrect.\n\nThis attempt has been logged.'
              };
            }

            return { valid: true };
          };

          // Process return/refund with enhanced security
          const processReturn = () => {
            if (!selectedSaleForReturn) return;
            
            // Security Check 1: Admin Access
            if (!hasPermission('Admin')) {
              alert('🔒 SECURITY ALERT\n\nOnly administrators can process returns.\n\nThis action has been logged for security review.');
              logAuditEvent('RETURN_ACCESS_DENIED', {
                attemptedBy: (currentUser && currentUser.name) || 'Unknown',
                role: (currentUser && currentUser.role) || 'Unknown',
                saleId: selectedSaleForReturn.id

            // Security Check 2: Basic Validation

            }

            if (!returnReason.trim()) {

            // Security Check 3: Time Limit
            if (!isSaleEligibleForReturn(selectedSaleForReturn)) {
              alert('⚠️ RETURN POLICY VIOLATION\n\nThis sale is older than 7 days and cannot be returned.\n\nReturn Policy: Items can only be returned within 7 days of purchase with original receipt.');

                saleDate: selectedSaleForReturn.date,

              });

            // Security Check 4: Calculate Refund Amount
            const refundAmount = calculateRefundAmount();

            // Security Check 5: Customer Verification
            const customerValidation = validateCustomerReturn();
            if (!customerValidation.valid) {
              alert(customerValidation.error);
              return;
            }

            // Security Check 6: Verification Code
            const codeValidation = validateVerificationCode();
            if (!codeValidation.valid) {

              return;

              alert(`🔒 MANAGER PASSWORD REQUIRED\n\n` +

                `Please enter manager password to proceed.`);
              return;

            // Verify manager password
            if (!verifyManagerPassword(returnManagerPassword)) {
              alert('❌ INVALID MANAGER PASSWORD\n\nManager password is incorrect.\n\nThis attempt has been logged.');

                saleId: selectedSaleForReturn.id,
                refundAmount: refundAmount,
                attemptedBy: currentUser.name
              });
              setReturnManagerPassword('');
              return;
            }

            // Security Check 8: Detailed Notes for Large Returns
            if (RETURN_SECURITY_CONFIG.requireDetailedReason && refundAmount > 500) {
              if (!returnNotes || returnNotes.trim().length < 10) {
                alert('⚠️ DETAILED REASON REQUIRED\n\nFor returns over KES 500, please provide detailed notes explaining the return reason.\n\nMinimum 10 characters required.');
                return;
              }

            // Security Check 9: Final Confirmation
            const customerInfo = returnCustomerPhone ? `\nCustomer: ${returnCustomerPhone}` : '';
            const managerInfo = returnManagerApproval ? `\n✅ Manager Approved: ${currentUser.name}` : '';
            const verificationInfo = returnVerificationCode ? `\n✅ Verification Code: ${returnVerificationCode}` : '';
            
            const confirmMsg = `🔒 FINAL RETURN CONFIRMATION\n\n` +
              `Sale #${selectedSaleForReturn.id}${customerInfo}${verificationInfo}${managerInfo}\n` +
              `Items: ${returnItems.length}\n` +
              `Refund Amount: KES ${refundAmount.toFixed(2)}\n` +
              `Refund Method: ${returnRefundMethod}\n` +
              `Reason: ${returnReason}\n` +
              `${returnNotes ? `\nNotes: ${returnNotes}` : ''}\n\n` +
              `⚠️ SECURITY NOTICE:\n` +
              `• This action will be logged\n` +
              `• Stock will be restored\n` +
              `• Return record will be created\n` +
              `• Refund will be processed\n\n` +
              `Are you absolutely sure you want to process this return?`;

            if (!window.confirm(confirmMsg)) {
              return;
            }

            // Restore stock for returned items
            const updatedProducts = products.map(product => {
              const returnItem = returnItems.find(item => item.id === product.id);
              if (returnItem) {
                return { ...product, stock: product.stock + returnItem.quantity };
              }
              return product;
            });
            setProducts(updatedProducts);

            // Create return record with enhanced security data
            const newReturn = {
              id: safeNextId(returns),
              saleId: selectedSaleForReturn.id,
              date: new Date().toISOString().split('T')[0],
              time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
              items: returnItems,
              originalSale: selectedSaleForReturn,
              refundAmount: refundAmount,
              refundMethod: returnRefundMethod,
              reason: returnReason,
              notes: returnNotes || '',
              customerPhone: returnCustomerPhone || '',
              verificationCode: returnVerificationCode || '',
              managerApproved: returnManagerApproval,
              managerName: returnManagerApproval ? currentUser.name : null,
              processedBy: currentUser.name,
              processorRole: currentUser.role,
              sessionToken: sessionToken,
              status: 'Completed',
              securityFlags: {
                requiresApproval: requiresManagerApproval,
                suspiciousPattern: returnCustomerPhone ? checkCustomerReturnFrequency(returnCustomerPhone).isSuspicious : false,
                verificationCodeUsed: !!returnVerificationCode
              }
            };

            setReturns([newReturn, ...returns]);

            // Update sale to mark items as returned
            const updatedSales = sales.map(sale => {
              if (sale.id === selectedSaleForReturn.id) {
                const returnedItems = sale.returnedItems || [];
                return {
                  ...sale,
                  returnedItems: [...returnedItems, ...returnItems],
                  hasReturns: true
                };
              }
              return sale;
            });
            setSales(updatedSales);

            // Security: Enhanced Audit Logging
            logAuditEvent('RETURN_PROCESSED', {
              returnId: newReturn.id,
              saleId: selectedSaleForReturn.id,
              refundAmount: refundAmount,
              items: returnItems.length,
              itemDetails: returnItems.map(ri => {
                const item = selectedSaleForReturn.itemDetails.find(i => i.id === ri.id);
                return { name: item.name, quantity: ri.quantity, price: item.sellingPrice };
              }),
              reason: returnReason,
              notes: returnNotes,
              customerPhone: returnCustomerPhone,
              verificationCode: returnVerificationCode ? '***' : null, // Don't log full code
              managerApproved: returnManagerApproval,
              managerName: returnManagerApproval ? currentUser.name : null,
              refundMethod: returnRefundMethod,
              securityFlags: newReturn.securityFlags,
              timestamp: new Date().toISOString()
            });

            alert(`✅ RETURN PROCESSED SUCCESSFULLY\n\n` +
              `Return #${newReturn.id}\n` +
              `Refund Amount: KES ${refundAmount.toFixed(2)}\n` +
              `Refund Method: ${returnRefundMethod}\n` +
              `Stock has been restored.`);

            // Reset return form
            setShowReturnModal(false);
            setSelectedSaleForReturn(null);
            setReturnItems([]);
            setReturnReason('');
            setReturnReceiptId('');
            setReturnVerificationCode('');
            setReturnManagerApproval(false);
            setReturnManagerPassword('');
            setReturnCustomerPhone('');
            setReturnNotes('');
          };

          // Find sale by receipt ID
          const findSaleByReceiptId = (receiptId) => {
            // Try to extract sale ID from receipt ID (format: RCP000001)
            const saleIdMatch = receiptId.match(/RCP0*(\d+)/i);
            if (saleIdMatch) {
              const saleId = parseInt(saleIdMatch[1]);
              return sales.find(s => s.id === saleId);

            return null;

                alert('⚠️ RETURN POLICY\n\nThis sale is older than 7 days and cannot be returned.');

              setReturnReceiptId('');

            setShowReturnModal(true);
          };

          const handleLogin = (e) => {
            e.preventDefault();
            
            // Input validation
            if (!validateInput(loginForm.username, 'username')) {
              alert('Invalid username format. Username must be 3-20 characters (letters, numbers, underscore only).');
              return;
            }

            if (!validateInput(loginForm.password, 'password')) {
              alert('Invalid password. Password must be at least 6 characters.');
              return;
            }

            // Rate limiting check
            if (!checkRateLimit(loginForm.username)) {
              alert('⚠️ TOO MANY LOGIN ATTEMPTS\n\nYou have exceeded the maximum number of login attempts.\nPlease wait 15 minutes before trying again.');
              return;
            }

            // Find user and verify password
            const user = users.find(u => u.username === loginForm.username);
            
            if (!user) {
              logAuditEvent('LOGIN_FAILED', { username: loginForm.username, reason: 'User not found' });
              alert('Invalid credentials! Please check your username and password.');
              return;
            }

            // Verify password (check both plain text for backward compatibility and hashed)
            const passwordHash = hashPassword(loginForm.password);
            const passwordMatch = user.passwordHash === passwordHash || user.password === loginForm.password;

            if (!passwordMatch) {
              logAuditEvent('LOGIN_FAILED', { username: loginForm.username, reason: 'Invalid password' });
              alert('Invalid credentials! Please check your username and password.');
              return;
            }

            // Successful login
            setCurrentUser(user);
            setIsLoggedIn(true);
            generateSessionToken();
            
            // Save to localStorage if Remember Me is checked
            if (loginForm.rememberMe) {
              localStorage.setItem('logged_in_user', JSON.stringify(user));
            }
            
            // Log successful login
            logAuditEvent('LOGIN_SUCCESS', { username: user.username, role: user.role });
            
            console.log('Login successful:', user.name);
          };

          /**
           * Handle User Logout

           * Clears user session and resets application state:

           * - Clears currentUser
           * - Empties shopping cart
           * - Removes saved login from localStorage
           * 
           * Note: Session token and audit logs remain for security tracking
           */
          const handleLogout = () => {
            setIsLoggedIn(false);
            setCurrentUser(null);
            setCart([]);
            localStorage.removeItem('logged_in_user');
          };

          // ============================================================================
          // SECTION 28: POS & SALES FUNCTIONS
          // ============================================================================
          /**
           * Add Product to Cart (by quantity)
           * Adds a product with optional quantity. If product exists, adds to existing qty.
           * @param {Object} product - Product to add
           * @param {number} qty - Quantity (default 1)
           */
          const addToCartWithQuantity = (product, qty) => {
            if (!product || !product.id) return;
            var num = typeof qty === 'number' && qty > 0 ? qty : 1;
            var existing = cart.find(function(item) { return item.id === product.id; });
            if (existing) {
              setCart(cart.map(function(item) {
                return item.id === product.id ? { ...item, quantity: item.quantity + num } : item;
              }));
            } else {
              setCart([...cart, { ...product, quantity: num }]);
            }
          };

          /**
           * Add Product to Cart
           * Adds with quantity 1. Use addToCartWithQuantity for custom qty.
           */
          const addToCart = (product) => {
            addToCartWithQuantity(product, 1);
          };

          /**
           * Sell by Amount: add product using KES value. Prompts for amount, computes qty = amount / price.
           * @param {Object} product - Product to add
           * @returns {boolean} true if item was added, false if cancelled or invalid
           */
          const addToCartByAmount = (product) => {
            if (!product || !product.id || !product.sellingPrice || product.stock <= 0) return false;
            var price = product.sellingPrice;
            var msg = 'SELL BY AMOUNT\n\n' + product.name + '\nPrice: KES ' + price.toLocaleString() + ' per unit\nStock: ' + product.stock + '\n\nEnter amount (KES):';
            var raw = window.prompt(msg, '');
            if (raw === null || raw === '') return false;
            var amount = parseFloat(String(raw).replace(/[^0-9.-]/g, ''));
            if (isNaN(amount) || amount <= 0) {
              alert('Please enter a valid amount (KES).');
              return false;
            }
            var qty = amount / price;
            if (qty < 0.001) {
              alert('Amount too small. Minimum ~KES ' + (price * 0.001).toFixed(2));
              return false;
            }
            var maxQty = product.stock;
            if (qty > maxQty) {
              qty = maxQty;
              alert('Capped at stock: ' + maxQty + ' units (KES ' + (maxQty * price).toFixed(2) + ').');
            }
            qty = Math.round(qty * 1000) / 1000;
            addToCartWithQuantity(product, qty);
            return true;
          };

          const finalizeMpesaSale = useCallback(() => {
            const total = cartTotal;
            const cost = cart.reduce((sum, item) => sum + (item.costPrice * item.quantity), 0);
            
            // Enhanced sale creation with detailed tracking
            const saleTimestamp = new Date().toISOString();
            const saleTime = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const newSale = {
              id: safeNextId(sales),
              date: new Date().toISOString().split('T')[0],

              timestamp: saleTimestamp,

              profit: total - cost,

              mpesaPhone: mpesaPhone,

              cashierId: currentUser.id,
              cashierRole: currentUser.role,
              itemDetails: [...cart]
            };
            
            // Log sale activity
            logEmployeeActivity('SALE', {
              saleId: newSale.id,
              total: total,
              items: cart.map(item => ({
                name: item.name,
                quantity: item.quantity,
                price: item.sellingPrice,
                subtotal: item.sellingPrice * item.quantity
              })),
              paymentMethod: 'M-Pesa',
              customerName: 'Walk-in',
              timestamp: saleTimestamp
            });

            });
            setProducts(updatedProducts);
            
            setLastSale(newSale);
            setShowReceipt(true);
            setCart([]);
            setMpesaPhone('');

          const completeSale = () => {

              alert('Cart is empty!');

              if ((splitPayment.cashAmount + splitPayment.mpesaAmount) < cartTotal) {
                alert('Split payment amounts do not cover the total!');

            // For Cash, Card, and Split payments, complete immediately

            const cost = cart.reduce((sum, item) => sum + (item.costPrice * item.quantity), 0);

            const saleTime = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                if (isTaxExempt(item)) return 0;

              vat = itemVATs.reduce((sum, v) => sum + v, 0);
              subtotal = total;

              splitCash: paymentMethod === 'Split' ? splitPayment.cashAmount : null,

            if (!scannedProduct || !stockQuantity || stockQuantity <= 0) {

            }

            const qty = parseInt(stockQuantity);
            const updatedProducts = products.map(p => 
              p.id === scannedProduct.id ? { ...p, stock: p.stock + qty } : p
            );
            setProducts(updatedProducts);

            const stockEntry = {
              id: safeNextId(stockHistory),
              date: new Date().toISOString().split('T')[0],
              time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),

            setStockBarcode('');
            setStockQuantity('');
            setScannedProduct(null);
          };

          const showDetails = (type) => {
            let data = {};
            switch(type) {
              case 'revenue':
                data = {
                  title: "Today's Revenue Details",
                  items: todaySales.map(s => ({
                    label: `Sale #${s.id} - ${s.time}`,
                    value: `KES ${s.total.toFixed(2)}`,
                    extra: `${s.items} items - ${s.paymentMethod}`
                  })),
                  total: `Total: KES ${todayRevenue.toFixed(2)}`
                };

              case 'profit':
                data = {
                  title: "Today's Profit Breakdown",
                  items: todaySales.map(s => ({
                    label: `Sale #${s.id} - ${s.time}`,
                    value: `KES ${s.profit.toFixed(2)}`,
                    extra: `Revenue: KES ${s.total.toFixed(2)}`
                  })),
                  total: `Total Profit: KES ${todayProfit.toFixed(2)}`
                };

              case 'inventory':
                data = {
                  title: "Inventory Value by Product",
                  items: products.map(p => ({
                    label: p.name,
                    value: `KES ${(p.sellingPrice * p.stock).toFixed(2)}`,
                    extra: `${p.stock} units @ KES ${p.sellingPrice} each`
                  })),
                  total: `Total Inventory: KES ${totalInventoryValue.toFixed(2)}`
                };
                break;
              case 'lowstock':
                data = {
                  title: "Low Stock Items - Action Required!",
                  items: lowStockItems.map(p => ({
                    label: p.name,
                    value: `${p.stock} units`,
                    extra: `Reorder at: ${p.reorderLevel} units`,
                    urgent: p.stock <= p.reorderLevel / 2
                  })),
                  total: `${lowStockItems.length} items need attention`
                };
                break;
            }
            setDetailModalData(data);
            setShowDetailModal(true);
          };

          // Memoized calculations for better performance (lowStockItems already defined above)
          
          const todayDate = new Date().toISOString().split('T')[0];
          
          const { expiringItems, expiredItems } = React.useMemo(() => {
            const today = new Date();
            const sevenDaysFromNow = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
            return {
              expiringItems: products.filter(p => {
                if (!p.expiryDate) return false;
                const expiry = new Date(p.expiryDate);
                return expiry <= sevenDaysFromNow && expiry >= today;
              }),
              expiredItems: products.filter(p => {
                if (!p.expiryDate) return false;
                return new Date(p.expiryDate) < new Date();
              })
            };
          }, [products]);
          
          const todaySales = React.useMemo(() => sales.filter(s => s.date === todayDate), [sales, todayDate]);
          const todayRevenue = React.useMemo(() => todaySales.reduce((sum, s) => sum + s.total, 0), [todaySales]);
          const todayProfit = React.useMemo(() => todaySales.reduce((sum, s) => sum + (s.profit || 0), 0), [todaySales]);
          const totalInventoryValue = React.useMemo(() => products.reduce((sum, p) => sum + (p.sellingPrice * p.stock), 0), [products]);

          // Product management functions
          const saveProductEdit = (productId) => {
            setProducts(products.map(p => p.id === productId ? editingProduct : p));

          const receivePurchase = (purchaseId) => {
            const purchase = purchases.find(p => p.id === purchaseId);

              const updatedProducts = [...products];
              purchase.items.forEach(item => {

                if (productIndex !== -1) {
                  updatedProducts[productIndex] = {
                    ...updatedProducts[productIndex],
                    stock: updatedProducts[productIndex].stock + item.qty

                }
              });
              setProducts(updatedProducts);
              
              // Update purchase status
              setPurchases(purchases.map(p => 
                p.id === purchaseId ? { ...p, status: 'Received', receivedDate: new Date().toISOString().split('T')[0] } : p

              alert('✅ Stock received and updated!');

          // Invoice functions
          const generateInvoice = () => {
            if (!selectedSaleForInvoice || !invoiceCustomer.name) {

            const sale = sales.find(s => s.id === selectedSaleForInvoice);
            const invoice = {

            setInvoices([invoice, ...invoices]);

          const markInvoicePaid = (invoiceId) => {

          // Report filtering by date range
          const getFilteredSalesByDate = () => {

            if (reportDateRange.start) {
              filtered = filtered.filter(s => s.date >= reportDateRange.start);

            return filtered;
          };

          const getBestSellingProducts = () => {
            const productSales = {};
            sales.forEach(sale => {
              if (sale.itemDetails) {
                sale.itemDetails.forEach(item => {
                  if (!productSales[item.name]) {
                    productSales[item.name] = { name: item.name, quantity: 0, revenue: 0 };
                  }
                  productSales[item.name].quantity += item.quantity;
                  productSales[item.name].revenue += item.sellingPrice * item.quantity;
                });
              }
            });
            return Object.values(productSales).sort((a, b) => b.revenue - a.revenue);
          };

          // Hold/Park current order
          const holdOrder = () => {
            if (cart.length === 0) {
              alert('Cart is empty!');
              return;
            }
            const holdName = prompt('Enter a name for this order (e.g., customer name):');
            if (holdName) {
              const heldOrder = {
                id: Date.now(),
                name: holdName,
                items: [...cart],
                total: cart.reduce((sum, item) => sum + (item.sellingPrice * item.quantity), 0),
                time: new Date().toLocaleTimeString(),
                date: new Date().toISOString().split('T')[0]

              setHeldOrders([...heldOrders, heldOrder]);
              setCart([]);
              setAmountReceived(0);
              alert('✅ Order held!\n\nName: ' + holdName + '\n\nYou can retrieve it anytime from "Held Orders"');
            }
          };

          // Retrieve held order
          const retrieveOrder = (orderId) => {
            const order = heldOrders.find(o => o.id === orderId);
            if (order) {
              if (cart.length > 0) {
                if (!window.confirm('Current cart has items. Replace with held order?')) {
                  return;
                }
              }
              setCart(order.items);
              setHeldOrders(heldOrders.filter(o => o.id !== orderId));
              setShowHeldOrders(false);

          };

          // Delete held order
          const deleteHeldOrder = (orderId) => {
            if (window.confirm('Delete this held order?')) {
              setHeldOrders(heldOrders.filter(o => o.id !== orderId));
            }
          };

          /**
           * Check if sale is eligible for voiding (time limit)
           * @param {Object} sale - Sale object
           * @returns {boolean} True if sale can be voided
           */
          const isSaleEligibleForVoid = (sale) => {
            if (!sale || sale.voided) return false;
            const saleDate = new Date(sale.date);
            const today = new Date();
            const daysDiff = Math.floor((today - saleDate) / (1000 * 60 * 60 * 24));
            // Allow voiding within 30 days
            return daysDiff <= 30;
          };

          // Void/Refund a completed sale with enhanced security
          const voidSale = (saleId) => {
            // Security Check 1: Admin Access Required
            if (!hasPermission('Admin')) {
              alert('🔒 SECURITY ALERT\n\nOnly administrators can void sales.\n\nThis action has been logged for security review.');
              logAuditEvent('VOID_ACCESS_DENIED', {
                attemptedBy: (currentUser && currentUser.name) || 'Unknown',
                role: (currentUser && currentUser.role) || 'Unknown',
                saleId: saleId
              });
              return;
            }

            const sale = sales.find(s => s.id === saleId);
            if (!sale) {
              alert('⚠️ Sale not found.');
              return;
            }

            // Security Check 2: Time Limit Validation
            if (!isSaleEligibleForVoid(sale)) {
              alert('⚠️ VOID TIME LIMIT EXCEEDED\n\nThis sale is older than 30 days and cannot be voided.\n\nPlease contact system administrator for assistance.');
              logAuditEvent('VOID_TIME_LIMIT_EXCEEDED', {
                saleId: saleId,
                saleDate: sale.date,
                attemptedBy: currentUser.name
              });
              return;
            }

            // Security Check 3: Reason Required
            if (!voidReason || voidReason.trim().length < 5) {
              alert('🔒 VOID REASON REQUIRED\n\nPlease provide a detailed reason for voiding this sale (minimum 5 characters).\n\nThis is required for audit compliance.');
              return;
            }

            // Security Check 4: Manager Password (ALWAYS REQUIRED for voids)
            if (!voidManagerApproval) {
              alert(`🔒 MANAGER PASSWORD REQUIRED\n\n` +
                `All void operations require manager password verification.\n\n` +
                `Please enter manager password to proceed.`);
              return;
            }
            
            // Verify manager password
            if (!verifyManagerPassword(voidManagerPassword)) {
              alert('❌ INVALID MANAGER PASSWORD\n\nManager password is incorrect.\n\nThis attempt has been logged.');
              logAuditEvent('VOID_MANAGER_PASSWORD_FAILED', {
                saleId: saleId,
                saleAmount: sale.total,
                attemptedBy: currentUser.name
              });
              setVoidManagerPassword('');
              return;
            }

            // Security Check 5: Customer Verification for High-Value Sales
            if (sale.total > 3000 && (!voidCustomerPhone || voidCustomerPhone.length < 10)) {
              alert('🔒 CUSTOMER VERIFICATION REQUIRED\n\nFor sales over KES 3,000, please enter customer phone number for verification.\n\nThis helps prevent fraudulent voids.');
              return;
            }

            // Security Check 6: Final Confirmation
            const customerInfo = voidCustomerPhone ? `\nCustomer: ${voidCustomerPhone}` : '';
            const managerInfo = voidManagerApproval ? `\n✅ Manager Approved: ${currentUser.name}` : '';
            
            const confirmMsg = `🔒 FINAL VOID CONFIRMATION\n\n` +
              `Sale #${saleId}${customerInfo}${managerInfo}\n` +
              `Date: ${sale.date} ${sale.time}\n` +
              `Total: KES ${sale.total.toLocaleString()}\n` +
              `Items: ${sale.items}\n` +
              `Payment: ${sale.paymentMethod}\n` +
              `Cashier: ${sale.cashier || 'Unknown'}\n` +
              `Reason: ${voidReason}\n\n` +
              `⚠️ SECURITY NOTICE:\n` +
              `• This action will be logged\n` +
              `• Stock will be restored\n` +
              `• Sale will be marked as voided\n` +
              `• Cannot be undone!\n\n` +
              `Are you absolutely sure you want to void this sale?`;
            
            if (!window.confirm(confirmMsg)) {
              return;
            }
            
            // Restore stock
            if (sale.itemDetails) {
              const updatedProducts = products.map(product => {
                const saleItem = sale.itemDetails.find(item => item.id === product.id);
                if (saleItem) {
                  return { ...product, stock: product.stock + saleItem.quantity };
                }
                return product;
              });
              setProducts(updatedProducts);
            }
            
            // Mark sale as voided with enhanced security data
            setSales(sales.map(s => s.id === saleId ? { 
              ...s, 
              voided: true, 
              voidedAt: new Date().toISOString(),
              voidedBy: currentUser.name,
              voidedByRole: currentUser.role,
              voidReason: voidReason,
              voidCustomerPhone: voidCustomerPhone || null,
              voidManagerApproved: voidManagerApproval,
              voidManagerName: voidManagerApproval ? currentUser.name : null,
              sessionToken: sessionToken
            } : s));
            
            // Enhanced Audit Logging
            logAuditEvent('SALE_VOIDED', {
              saleId: saleId,
              originalTotal: sale.total,
              items: sale.items,
              itemDetails: (sale.itemDetails && sale.itemDetails.map) ? sale.itemDetails.map(item => ({
                name: item.name,
                quantity: item.quantity,
                price: item.sellingPrice
              })) : [],
              paymentMethod: sale.paymentMethod,
              cashier: sale.cashier,
              reason: voidReason,
              customerPhone: voidCustomerPhone,
              managerApproved: voidManagerApproval,
              managerName: voidManagerApproval ? currentUser.name : null,
              timestamp: new Date().toISOString(),
              sessionToken: sessionToken
            });
            
            alert(`✅ Sale #${saleId} has been voided.\n\n` +
              `Stock has been restored.\n` +
              `Reason: ${voidReason}\n` +
              `This action has been logged for audit.`);
            
            // Reset void form
            setShowVoidSale(false);
            setSelectedSaleForVoid(null);
            setVoidReason('');
            setVoidManagerPassword('');
            setVoidManagerApproval(false);
            setVoidCustomerPhone('');

          const cancelOrder = () => {

            if (window.confirm(`🚫 CANCEL ORDER?\n\nItems: ${cart.length}\nTotal: KES ${cartTotal.toLocaleString()}\n\nThis will clear the entire cart.`)) {

          // Detail Modal Component
